<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="description" content="双休聘 - 只找双休好工作，看真实企业点评" />
    <title>双休聘</title>
    <link rel="icon" type="image/png" href="/logo.png?v=1" />
    <link rel="apple-touch-icon" href="/logo.png?v=1" />
    <script>
      // 深浅模式：优先读用户在设置里的选择（sxu_theme_mode=auto/light/dark），
      // auto 跟随系统；渲染前同步到 <html>，antd-mobile 官方暗色变量与自有 --sxu-* 变量随之生效，避免首屏闪白
      (function () {
        var m = window.matchMedia("(prefers-color-scheme: dark)");
        var apply = function () {
          var v = "auto";
          try { v = localStorage.getItem("sxu_theme_mode") || "auto"; } catch (e) {}
          var dark = v === "dark" || (v !== "light" && m.matches);
          document.documentElement.dataset.prefersColorScheme = dark ? "dark" : "light";
        };
        apply();
        m.addEventListener("change", apply);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
